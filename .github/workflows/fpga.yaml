name: fpga

# Builds an ICE40UP5K bitstream for the Tiny Tapeout FPGA emulator. The template
# ships this workflow disabled; it is enabled here because it passes.
#
# One thing had to change in the RTL to get there. src/ring_osc.v is a deliberate
# combinational loop, and nextpnr-ice40 refuses a design that contains one:
#
#   ERROR: timing analysis failed due to presence of combinatorial loops,
#   incomplete specification of timing ports, etc.
#
# tt_fpga.py synthesises with -DSYNTH, so src/entropy_source.v takes that as the
# signal to leave the rings out and take entropy from ENT_IN (uio_in[0]) instead.
# That is the right build for an FPGA anyway: routed LUTs cannot make a usable
# ring oscillator TRNG, so on a board the noise has to come from outside. Nothing
# else about the design changes, and the ASIC flow does not define SYNTH. Two
# committed checks fail if it ever does: scripts/synth_report.sh counts the mapped
# ring stages and scripts/parse_harden.py counts them again after routing.
#
# Measured on the up5k: 680 of 5280 logic cells, 26 of 96 I/O, and 33.3 MHz
# register to register against the 25.175 MHz pixel clock.
on:
  push:
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttihp26a
