name: gds

# Hardens the tile to GDS with LibreLane, runs Tiny Tapeout's precheck, re-runs the
# cocotb regression against the hardened gate level netlist, and publishes the
# layout to GitHub Pages for the 3D viewer.
#
# All four jobs run on plain ubuntu-24.04 runners with no secrets and no Tiny
# Tapeout API access, and all four pass on this repository. What still requires
# Tiny Tapeout is submitting to a shuttle and fabrication, which no workflow here
# does.
#
# Note on gl_test. It ran for 1h51m and was removed once, because two things have
# to be dealt with before a gate level run of this netlist means anything, and both
# are specific to this design rather than to CI:
#
#   1. The IHP cell models clock from the delayed_* signals their $setuphold and
#      $recrem checks produce. Stock Icarus does not drive those and every flop
#      holds x forever. The patched Icarus 13 this action installs does drive them.
#      scripts/run_gl.sh unpacks the same build locally.
#
#   2. src/ring_osc.v is a deliberate combinational loop and it survives synthesis,
#      so the netlist holds a five inverter and a seven inverter ring against zero
#      delay cell models. The simulator runs the reset phase and then stops
#      advancing in time. test/tb.v cuts both rings with a force, which settles the
#      sampled entropy bit to a constant 0 and makes raw_bit exactly uio_in[0], the
#      same source the RTL regression drives. test/test_gl.py asserts that rather
#      than assuming it, so the same test module can run against both.
#
# The oscillator itself is therefore not gate level verified and cannot be. It is
# covered structurally by test/tb_ring.v and by the stage counts that
# scripts/synth_report.sh and scripts/parse_harden.py enforce.
on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26a
        with:
          pdk: ihp-sg13g2
          librelane-version: 3.0.0.dev44

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Gate level test on the hardened netlist
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26a
