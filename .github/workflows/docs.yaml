name: docs

# Renders docs/info.md into the shuttle datasheet using Tiny Tapeout's support
# tools. It runs on a plain ubuntu-24.04 runner with no secrets and no Tiny
# Tapeout API access, and it passes on every push here. What it does not do is
# submit anything: the datasheet is a render of docs/info.md, not a shuttle
# entry.
on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttihp26a
